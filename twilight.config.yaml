# 站点配置
site:
    # 站点 URL（以斜杠结尾）
    siteURL: "https://ecohydraulics.org/"
    # 站点标题
    title: "ECOHYDRAULICS"
    # 站点副标题
    subtitle: "From the community for the community"
    # 语言配置
    lang: "en"
    # 翻译配置
    translate:
        # 启用翻译功能
        enable: true
        # 翻译服务
        service: "client.edge"
        # 显示语言选择下拉框
        showSelectTag: false
        # 自动检测用户语言
        autoDiscriminate: true
        # 翻译时忽略的 CSS 类名
        ignoreClasses:
            - "ignore"
            - "banner-title"
            - "banner-subtitle"
        # 翻译时忽略的 HTML 标签
        ignoreTags:
            - "script"
            - "style"
            - "code"
            - "pre"
    # 时区配置
    timeZone: 8
    # 字体配置
    font:
        # 示例字体配置 - Zen Maru Gothic
        "Example - ZenMaruGothic":
            # 字体源 (字体 CSS 链接 | 字体文件路径)
            src: "https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap"
            # 字体名 (font-family)
            family: "Zen Maru Gothic"
    # 主题色配置
    themeColor:
        # 主题色的默认色相 (范围从 0 到 360。例如：红色：0，青色：200，蓝绿色：250，粉色：345)
        hue: 255
    # 默认主题 ("system" 跟随系统 | "light" 浅色 | "dark" 深色)
    defaultTheme: "dark"
    # 壁纸配置
    wallpaper:
        # 模式 ("banner" 横幅 | "fullscreen" 全屏 | "none" 纯色)
        mode: "banner"
        # 图片源配置 (fullscreen 和 banner 模式共享)
        src:
            # 桌面壁纸图片 (相对于 /public 目录; 支持单张图片或图片数组，当数组长度 > 1 时自动启用轮播)
            desktop:
                - "/assets/images/desktopWallpaper_1.jpg"
                - "/assets/images/desktopWallpaper_2.jpg"
                - "/assets/images/desktopWallpaper_3.jpg"
                - "/assets/images/desktopWallpaper_4.jpg"
            # 移动壁纸图片 (相对于 /public 目录; 支持单张图片或图片数组，当数组长度 > 1 时自动启用轮播)
            mobile:
                - "/assets/images/mobileWallpaper_1.jpg"
                - "/assets/images/mobileWallpaper_2.jpg"
        # 壁纸位置 ('top' | 'center' | 'bottom')
        position: "center"
        # 轮播配置 (fullscreen 和 banner 模式共享)
        carousel:
            # 为多张图片启用轮播，否则随机显示一张图片
            enable: true
            # 轮播间隔时间 (秒)
            interval: 3.6
            # 启用 Ken Burns 效果
            kenBurns: true
        # Banner 模式专属配置
        banner:
            # 横幅文本配置
            homeText:
                # 在主页显示文本
                enable: true
                # 主标题
                title: "ECOHYDRAULICS"
                # 副标题，支持单个字符串或字符串数组
                subtitle:
                    - "From the community for the community"
                # 副标题打字机效果
                typewriter:
                    # 启用副标题打字机效果
                    enable: true
                    # 打字速度 (毫秒)
                    speed: 111
                    # 删除速度 (毫秒)
                    deleteSpeed: 51
                    # 完全显示后的暂停时间 (毫秒)
                    pauseTime: 3000
            # 横幅图片来源文本
            credit:
                # 显示横幅图片来源文本
                enable: false
                # 要显示的来源文本
                text: "Describe"
                # (可选) 原始艺术品或艺术家页面的 URL 链接
                url: ""
            # 导航栏配置
            navbar:
                # 导航栏透明模式 ("semi" 半透明加圆角 | "full" 完全透明 | "semifull" 动态透明)
                transparentMode: "semifull"
            # 水波纹效果配置
            waves:
                # 启用水波纹效果
                enable: true
                # 启用性能模式 (简化波浪效果以提升性能)
                performanceMode: false
        # Fullscreen 模式专属配置
        fullscreen:
            # 层级
            zIndex: -1
            # 壁纸透明度，0-1之间
            opacity: 0.9
            # 背景模糊程度 (像素值)
            blur: 1
            # 导航栏透明模式
            navbar:
                transparentMode: "semi"
    # 加载页配置
    loadingOverlay:
        # 是否启用加载页
        enable: true
        # 是否等待所有资源 (如图片、样式表) 加载完成
        waitForAllResources: true
        # 加载标题配置
        title:
            # 是否启用加载标题
            enable: true
            # 加载标题文本
            content: "LOADING"
            # 动画周期 (s)
            interval: 1.5
        # 加载动画配置
        spinner:
            # 是否启用加载动画
            enable: true
            # 动画周期 (s)
            interval: 1.5
    # favicon 配置
    favicon:
        - src: "/favicon/ecohydraulics-32.png"
          sizes: "32x32"
        - src: "/favicon/ecohydraulics-96.png"
          sizes: "96x96"
        - src: "/favicon/ecohydraulics-180.png"
          sizes: "180x180"
        - src: "/favicon/ecohydraulics-192.png"
          sizes: "192x192"
    # bangumi 配置
    bangumi:
        # 用户 ID
        userId: "your-bangumi-id"
    # OpenGraph 配置
    generateOgImages: false

# 统计配置
analytics:
    # 是否启用统计
    enabled: false
    # 统计平台
    platform: "umami"
    # Umami 统计配置
    umami:
        # Umami API 地址
        baseUrl: "https://api.umami.is"
        # API 密钥
        apiKey: ''
        # Tracking code
        code: ''

# 导航栏配置 (镜像自 ecohydraulics.org 的 WordPress 主菜单)
navbar:
    # 链接配置 (链接预设位于 src/constants/link-presets.ts 的 LinkPresets)
    links:
        - # 一级导航链接 - 主页 (预设)
            "Home"
        - # About (含下拉面板)
            name: "About"
            url: "/about/"
            icon: "material-symbols:info"
            description: "About the Ecohydraulics community"
            children:
                - name: "What is it?"
                  url: "/what-is-it/"
                  icon: "material-symbols:help"
                - name: "History"
                  url: "/history/"
                  icon: "material-symbols:history"
                - name: "Governance"
                  url: "/governance/"
                  icon: "material-symbols:gavel"
                - name: "Leadership Team"
                  url: "/lt/"
                  icon: "material-symbols:groups"
                - name: "Elections"
                  url: "/elections/"
                  icon: "material-symbols:how-to-vote"
        - # Community (含下拉面板)
            name: "Community"
            url: "/community/"
            icon: "material-symbols:diversity-3"
            description: "The Ecohydraulics community"
            children:
                - name: "Conferences"
                  url: "/conferences/"
                  icon: "material-symbols:co-present"
                - name: "Awards"
                  url: "/awards/"
                  icon: "material-symbols:trophy"
                - name: "Jobs"
                  url: "/jobs/"
                  icon: "material-symbols:work"
                - name: "Allied Organizations"
                  url: "/allied-organizations/"
                  icon: "material-symbols:handshake"
                - name: "Video Channel"
                  url: "https://www.youtube.com/@ecohydraulics9581"
                  icon: "fa6-brands:youtube"
        - # Education (含下拉面板)
            name: "Education"
            url: "/events/"
            icon: "material-symbols:school"
            description: "Education and events"
            children:
                - name: "Training"
                  url: "/training/"
                  icon: "material-symbols:fitness-center"
        - # Research (含下拉面板)
            name: "Research"
            url: "/research/"
            icon: "material-symbols:science"
            description: "Research resources"
            children:
                - name: "Journal"
                  url: "/journal/"
                  icon: "material-symbols:menu-book"
                - name: "Software Guide"
                  url: "/software-guide/"
                  icon: "material-symbols:code"
        - # ECoENet (一级链接)
            name: "ECoENet"
            url: "/ecoenet/"
            icon: "material-symbols:hub"
            description: "Early Career Ecohydraulics Network"
        - # Blog (映射到归档预设)
            name: "Blog"
            url: "/archive/"
            icon: "material-symbols:rss-feed"
            description: "Ecohydraulics blog"

# 侧边栏配置
sidebar:
    # 侧边栏组件配置列表 (侧栏组件预设位于 src/types/config.ts 的 WidgetComponentType)
    components:
        # 左侧侧边栏 (目录/类别/标签面板已按需求移除)
        left: []
        # 右侧侧边栏
        right:
            - # 组件 - 资料 (预设)
                # 类型
                type: "profile"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "top"
                # 页面可见性配置
                visibility:
                    # 匹配模式：'include' (包含), 'exclude' (排除)
                    mode: "exclude"
                    # 页面路径匹配规则列表 (支持正则字符串)
                    paths: ["^/posts/", "^/archive"]
            - # 组件 - 公告 (预设)
                # 类型
                type: "announcement"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "top"
                # 页面可见性配置
                visibility:
                    # 匹配模式：'include' (包含), 'exclude' (排除)
                    mode: "include"
                    # 页面路径匹配规则列表 (支持正则字符串)
                    paths: ["^/$"]
            - # 组件 - 文章目录 (预设)
                # 类型
                type: "toc"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
                # 目录深度 (1-6，1 表示只显示 h1 标题，2 表示显示 h1 和 h2 标题，依此类推)
                depth: 3
            - # 组件 - 文章统计 (预设)
                # 类型
                type: "statistics"
                # 位置策略 ("top" 顶部固定 | "sticky" 粘性)
                position: "sticky"
                # 页面可见性配置
                visibility:
                    # 匹配模式：'include' (包含), 'exclude' (排除)
                    mode: "include"
                    # 页面路径匹配规则列表 (支持正则字符串)
                    paths: ["^/$", "^/archive$"]

# 资料配置
profile:
    # 头像配置 (相对于 /public 目录)
    avatar: "/assets/images/ecohydraulics.png"
    # 信息配置
    name: "Ecohydraulics"
    # 简介配置
    bio: "From the community for the community"
    # 链接配置
    links:
        - name: "YouTube"
          icon: "fa6-brands:youtube"
          url: "https://www.youtube.com/@ecohydraulics9581"

# 公告配置
announcement:
    # 公告标题
    title: "Welcome"
    # 公告内容
    content: "Welcome to the Ecohydraulics community website!"
    # 允许用户关闭公告
    closable: true
    # 链接配置
    link:
        # 启用链接
        enable: true
        # 链接文本
        text: "Learn More"
        # 链接 URL
        url: "/about/"
        # 是否外部链接
        external: false

# 文章配置
post:
    # 文章卡片配置
    card:
        # 封面
        cover:
            # 位置 ("left" | "right")
            side: "left"
            # 封面宽度
            width: "33%"
            # 封面上是否显示文字 (标题、标签、摘要)
            showContent: true
        # 标题大小 (Tailwind 文本大小类，例如 "text-3xl")
        titleSize: "text-2xl"
    # 显示"上次编辑"卡片
    showLastModified: true
    # 代码高亮配置
    expressiveCode:
        # 主题
        theme: "github-dark"
    # 许可证配置
    license:
        # 启用许可证
        enable: true
        # 许可证名称
        name: "CC BY-NC-SA 4.0"
        # 许可证链接
        url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    # 评论配置
    comment:
        # 启用评论功能
        enable: false
        # Twikoo 评论系统配置
        twikoo:
            # 环境 ID
            envId: "https://twikoo.vercel.app"
            # 语言
            lang: "en"

# 页脚配置
footer:
    # 启用 Footer HTML 注入功能
    enable: false
    # 自定义 HTML 内容，用于添加备案号等信息
    customHtml: ""

# 粒子特效配置
particle:
    # 启用粒子特效
    enable: true
    # 粒子数量
    particleNum: 12
    # 粒子越界限制次数，-1为无限循环
    limitTimes: -1
    # 粒子尺寸配置
    size:
        # 粒子最小尺寸倍数
        min: 0.3
        # 粒子最大尺寸倍数
        max: 0.9
    # 粒子透明度配置
    opacity:
        # 粒子最小不透明度
        min: 0.3
        # 粒子最大不透明度
        max: 0.9
    # 粒子移动速度配置
    speed:
        # 水平移动速度
        horizontal:
            # 最小值
            min: -0.9
            # 最大值
            max: 0.9
        # 垂直移动速度
        vertical:
            # 最小值
            min: 0.15
            # 最大值
            max: 0.3
        # 旋转速度
        rotation: 0.12
        # 消失速度
        fadeSpeed: 0.12
    # 粒子层级
    zIndex: 100

# 音乐播放器配置
musicPlayer:
    # 启用音乐播放器功能
    enable: false
    # 默认模式 ("meting" API | "local" 本地)
    mode: "meting"
    # meting 模式专属配置
    meting:
        # Meting API 地址
        meting_api: "https://meting.spr-aachen.com/api"
        # 音乐平台
        server: "netease"
        # 类型 ("playlist" 歌单 | "song" 单曲)
        type: "playlist"
        # 资源 ID
        id: "2161912966"
    # local 模式专属配置
    local:
        # 播放列表
        playlist:
            - # 列表示例
                # 序号
                id: 1
                # 标题
                title: "深海之息"
                # 作者
                artist: "Youzee Music"
                # 封面
                cover: "https://p1.music.126.net/PhKOqFtljgHDDpKYM2ADUA==/109951169858309716.jpg"
                # 音乐路径
                url: "assets/music/深海之息.m4a"
                # 歌词路径
                lrc: "assets/music/深海之息.lrc"
                # 时长
                duration: 146
    # 是否自动播放
    autoplay: true

# 看板娘配置
pio:
    # 启用看板娘
    enable: false
    # 模型文件路径
    models:
        - "/pio/models/pio/model.json"
    # 看板娘位置
    position: "left"
    # 看板娘宽度
    width: 280
    # 看板娘高度
    height: 250
    # 展现模式
    mode: "draggable"
    # 是否在移动设备上隐藏
    hiddenOnMobile: true
    # 对话框配置
    dialog:
        # 欢迎词
        welcome: "Welcome!"
        # 触摸提示
        touch:
            - "What are you doing?"
            - "Stop touching me!"
            - "Don't bully me like that!"
            - "(｡í _ ì｡)"
        # 首页提示
        home: "Click here to go back to homepage!"
        # 换装提示
        skin:
            - "Want to see my new outfit?"
            - "The new outfit looks great~"
        # 关闭提示
        close: "See you next time~"
        # 关于链接
        link: "https://nav.kungal.org"