# Site configuration
site:
    # Site URL (with trailing slash)
    siteURL: "https://ecohydraulics.org/"
    # Site title
    title: "ECOHYDRAULICS"
    # Site subtitle
    subtitle: "From the community for the community"
    # Language
    lang: "en"
    # Translation configuration
    translate:
        # Enable the translation feature
        enable: true
        # Translation service
        service: "client.edge"
        # Show the language selector dropdown
        showSelectTag: false
        # Auto-detect the user's language
        autoDiscriminate: true
        # CSS class names to ignore when translating
        ignoreClasses:
            - "ignore"
            - "banner-title"
            - "banner-subtitle"
        # HTML tags to ignore when translating
        ignoreTags:
            - "script"
            - "style"
            - "code"
            - "pre"
    # Time zone
    timeZone: 8
    # Font configuration
    font:
        # Example font configuration - Zen Maru Gothic
        "Example - ZenMaruGothic":
            # Font source (font CSS link | font file path)
            src: "https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap"
            # Font name (font-family)
            family: "Zen Maru Gothic"
    # Theme color configuration
    themeColor:
        # Default hue of the theme color (range 0 to 360. e.g. red: 0, cyan: 200, teal: 250, pink: 345)
        hue: 255
    # Default theme ("system" follows the OS | "light" | "dark")
    defaultTheme: "dark"
    # Wallpaper configuration
    wallpaper:
        # Mode ("banner" | "fullscreen" | "none" solid color)
        mode: "banner"
        # Image source configuration (shared by fullscreen and banner modes)
        src:
            # Desktop wallpaper images (relative to /public; supports a single image or an array, carousel auto-enabled when length > 1)
            desktop:
                - "/assets/images/desktopWallpaper_1.jpg"
                - "/assets/images/desktopWallpaper_2.jpg"
                - "/assets/images/desktopWallpaper_3.jpg"
                - "/assets/images/desktopWallpaper_4.jpg"
            # Mobile wallpaper images (relative to /public; supports a single image or an array, carousel auto-enabled when length > 1)
            mobile:
                - "/assets/images/mobileWallpaper_1.jpg"
                - "/assets/images/mobileWallpaper_2.jpg"
        # Wallpaper position ('top' | 'center' | 'bottom')
        position: "center"
        # Carousel configuration (shared by fullscreen and banner modes)
        carousel:
            # Enable the carousel for multiple images, otherwise show a random image
            enable: true
            # Carousel interval (seconds)
            interval: 3.6
            # Enable the Ken Burns effect
            kenBurns: true
        # Banner-mode-only configuration
        banner:
            # Banner text configuration
            homeText:
                # Show text on the home page
                enable: true
                # Main title
                title: "ECOHYDRAULICS"
                # Subtitle, supports a single string or an array of strings
                subtitle:
                    - "From the community for the community"
                # Subtitle typewriter effect
                typewriter:
                    # Enable the subtitle typewriter effect
                    enable: true
                    # Typing speed (milliseconds)
                    speed: 111
                    # Deleting speed (milliseconds)
                    deleteSpeed: 51
                    # Pause time after fully displayed (milliseconds)
                    pauseTime: 3000
            # Banner image credit text
            credit:
                # Show the banner image credit text
                enable: false
                # Credit text to display
                text: "Describe"
                # (Optional) URL link to the original artwork or artist page
                url: ""
            # Navbar configuration
            navbar:
                # Navbar transparency mode ("semi" semi-transparent with rounded corners | "full" fully transparent | "semifull" dynamic transparency)
                transparentMode: "semifull"
            # Water wave effect configuration
            waves:
                # Enable the water wave effect
                enable: true
                # Enable performance mode (simplified wave effect for better performance)
                performanceMode: false
        # Fullscreen-mode-only configuration
        fullscreen:
            # z-index
            zIndex: -1
            # Wallpaper opacity, between 0 and 1
            opacity: 0.9
            # Background blur amount (pixels)
            blur: 1
            # Navbar transparency mode
            navbar:
                transparentMode: "semi"
    # Loading overlay configuration
    loadingOverlay:
        # Whether to enable the loading overlay
        enable: true
        # Whether to wait for all resources (e.g. images, stylesheets) to finish loading
        waitForAllResources: true
        # Loading title configuration
        title:
            # Whether to enable the loading title
            enable: true
            # Loading title text
            content: "Splashing"
            # Animation cycle (s)
            interval: 1.5
        # Loading spinner configuration
        spinner:
            # Whether to enable the loading spinner
            enable: true
            # Animation cycle (s)
            interval: 1.5
    # Favicon configuration
    favicon:
        - src: "/favicon/ecohydraulics-32.png"
          sizes: "32x32"
        - src: "/favicon/ecohydraulics-96.png"
          sizes: "96x96"
        - src: "/favicon/ecohydraulics-180.png"
          sizes: "180x180"
        - src: "/favicon/ecohydraulics-192.png"
          sizes: "192x192"
    # Bangumi configuration
    bangumi:
        # User ID
        userId: "your-bangumi-id"
    # OpenGraph configuration
    generateOgImages: false

# Analytics configuration
analytics:
    # Whether to enable analytics
    enabled: false
    # Analytics platform
    platform: "umami"
    # Umami analytics configuration
    umami:
        # Umami API URL
        baseUrl: "https://api.umami.is"
        # API key
        apiKey: ''
        # Tracking code
        code: ''

# Navbar configuration (mirrors the WordPress main menu of ecohydraulics.org)
navbar:
    # Link configuration (link presets are in LinkPresets in src/constants/link-presets.ts)
    links:
        - # Top-level nav link - Home (preset)
            "Home"
        - # About (with dropdown panel)
            name: "About"
            url: "/about/"
            icon: "material-symbols:info"
            description: "About the Ecohydraulics community"
            children:
                - name: "What is it?"
                  url: "/what-is-it/"
                  icon: "material-symbols:help"
                - name: "History"
                  url: "/history/"
                  icon: "material-symbols:history"
                - name: "Governance"
                  url: "/governance/"
                  icon: "material-symbols:gavel"
                - name: "Leadership Team"
                  url: "/lt/"
                  icon: "material-symbols:groups"
                - name: "Elections"
                  url: "/elections/"
                  icon: "material-symbols:how-to-vote"
        - # Community (with dropdown panel)
            name: "Community"
            url: "/community/"
            icon: "material-symbols:diversity-3"
            description: "The Ecohydraulics community"
            children:
                - name: "Conferences"
                  url: "/conferences/"
                  icon: "material-symbols:co-present"
                - name: "Awards"
                  url: "/awards/"
                  icon: "material-symbols:trophy"
                - name: "Jobs"
                  url: "/jobs/"
                  icon: "material-symbols:work"
                - name: "Allied Organizations"
                  url: "/allied-organizations/"
                  icon: "material-symbols:handshake"
                - name: "Video Channel"
                  url: "https://www.youtube.com/@ecohydraulics9581"
                  icon: "fa6-brands:youtube"
        - # Education (with dropdown panel)
            name: "Education"
            url: "/events/"
            icon: "material-symbols:school"
            description: "Education and events"
            children:
                - name: "Training"
                  url: "/training/"
                  icon: "material-symbols:fitness-center"
        - # Research (with dropdown panel)
            name: "Research"
            url: "/research/"
            icon: "material-symbols:science"
            description: "Research resources"
            children:
                - name: "Journal"
                  url: "/journal/"
                  icon: "material-symbols:menu-book"
                - name: "Software Guide"
                  url: "/software-guide/"
                  icon: "material-symbols:code"
        - # ECoENet (top-level link)
            name: "ECoENet"
            url: "/ecoenet/"
            icon: "material-symbols:hub"
            description: "Early Career Ecohydraulics Network"
        - # Blog (mapped to the archive preset)
            name: "Blog"
            url: "/archive/"
            icon: "material-symbols:rss-feed"
            description: "Ecohydraulics blog"

# Sidebar configuration
sidebar:
    # List of sidebar component configurations (sidebar component presets are in WidgetComponentType in src/types/config.ts)
    components:
        # Left sidebar (TOC/categories/tags panels removed as required)
        left: []
        # Right sidebar
        right:
            - # Component - profile (preset)
                # Type
                type: "profile"
                # Position strategy ("top" fixed at top | "sticky")
                position: "top"
                # Page visibility configuration
                visibility:
                    # Match mode: 'include', 'exclude'
                    mode: "exclude"
                    # List of page path match rules (regex strings supported)
                    paths: ["^/posts/", "^/archive"]
            - # Component - announcement (preset)
                # Type
                type: "announcement"
                # Position strategy ("top" fixed at top | "sticky")
                position: "top"
                # Page visibility configuration
                visibility:
                    # Match mode: 'include', 'exclude'
                    mode: "include"
                    # List of page path match rules (regex strings supported)
                    paths: ["^/$"]
            - # Component - table of contents (preset)
                # Type
                type: "toc"
                # Position strategy ("top" fixed at top | "sticky")
                position: "sticky"
                # TOC depth (1-6, 1 shows only h1 headings, 2 shows h1 and h2, and so on)
                depth: 3
            - # Component - post statistics (preset)
                # Type
                type: "statistics"
                # Position strategy ("top" fixed at top | "sticky")
                position: "sticky"
                # Page visibility configuration
                visibility:
                    # Match mode: 'include', 'exclude'
                    mode: "include"
                    # List of page path match rules (regex strings supported)
                    paths: ["^/$", "^/archive$"]

# Profile configuration
profile:
    # Avatar configuration (relative to /public)
    avatar: "/assets/images/ecohydraulics.png"
    # Name
    name: "Ecohydraulics"
    # Bio
    bio: "From the community for the community"
    # Link configuration
    links:
        - name: "YouTube"
          icon: "fa6-brands:youtube"
          url: "https://www.youtube.com/@ecohydraulics9581"

# Announcement configuration
announcement:
    # Announcement title
    title: "Welcome"
    # Announcement content
    content: "Welcome to the Ecohydraulics community website!"
    # Allow the user to close the announcement
    closable: true
    # Link configuration
    link:
        # Enable the link
        enable: true
        # Link text
        text: "Learn More"
        # Link URL
        url: "/about/"
        # Whether it is an external link
        external: false

# Post configuration
post:
    # Post card configuration
    card:
        # Cover
        cover:
            # Position ("left" | "right")
            side: "left"
            # Cover width
            width: "33%"
            # Whether to show text (title, tags, excerpt) on the cover
            showContent: true
        # Title size (Tailwind text size class, e.g. "text-3xl")
        titleSize: "text-2xl"
    # Show the "last modified" card
    showLastModified: true
    # Code highlighting configuration
    expressiveCode:
        # Theme
        theme: "github-dark"
    # License configuration
    license:
        # Enable the license
        enable: true
        # License name
        name: "CC BY-NC-SA 4.0"
        # License URL
        url: "https://creativecommons.org/licenses/by-nc-sa/4.0/"
    # Comment configuration
    comment:
        # Enable the comment feature
        enable: false
        # Twikoo comment system configuration
        twikoo:
            # Environment ID
            envId: "https://twikoo.vercel.app"
            # Language
            lang: "en"

# Footer configuration
footer:
    # Enable footer HTML injection
    enable: false
    # Custom HTML content, for adding ICP license numbers and similar info
    customHtml: ""

# Particle effect configuration
particle:
    # Enable the particle effect
    enable: true
    # Number of particles
    particleNum: 12
    # Number of out-of-bounds wraps allowed per particle, -1 for infinite
    limitTimes: -1
    # Particle size configuration
    size:
        # Minimum particle size multiplier
        min: 0.3
        # Maximum particle size multiplier
        max: 0.9
    # Particle opacity configuration
    opacity:
        # Minimum particle opacity
        min: 0.3
        # Maximum particle opacity
        max: 0.9
    # Particle movement speed configuration
    speed:
        # Horizontal movement speed
        horizontal:
            # Minimum value
            min: -0.9
            # Maximum value
            max: 0.9
        # Vertical movement speed
        vertical:
            # Minimum value
            min: 0.15
            # Maximum value
            max: 0.3
        # Rotation speed
        rotation: 0.12
        # Fade-out speed
        fadeSpeed: 0.12
    # Particle z-index
    zIndex: 100

# Music player configuration
musicPlayer:
    # Enable the music player feature
    enable: false
    # Default mode ("meting" API | "local")
    mode: "meting"
    # meting-mode-only configuration
    meting:
        # Meting API URL
        meting_api: "https://meting.spr-aachen.com/api"
        # Music platform
        server: "netease"
        # Type ("playlist" | "song")
        type: "playlist"
        # Resource ID
        id: "2161912966"
    # local-mode-only configuration
    local:
        # Playlist
        playlist:
            - # List example
                # Index
                id: 1
                # Title
                title: "深海之息"
                # Artist
                artist: "Youzee Music"
                # Cover
                cover: "https://p1.music.126.net/PhKOqFtljgHDDpKYM2ADUA==/109951169858309716.jpg"
                # Music file path
                url: "assets/music/深海之息.m4a"
                # Lyrics file path
                lrc: "assets/music/深海之息.lrc"
                # Duration
                duration: 146
    # Whether to autoplay
    autoplay: true

# Live2D mascot (pio) configuration
pio:
    # Enable the mascot
    enable: false
    # Model file paths
    models:
        - "/pio/models/pio/model.json"
    # Mascot position
    position: "left"
    # Mascot width
    width: 280
    # Mascot height
    height: 250
    # Display mode
    mode: "draggable"
    # Whether to hide on mobile devices
    hiddenOnMobile: true
    # Dialog configuration
    dialog:
        # Welcome message
        welcome: "Welcome!"
        # Touch prompts
        touch:
            - "What are you doing?"
            - "Stop touching me!"
            - "Don't bully me like that!"
            - "(｡í _ ì｡)"
        # Home page prompt
        home: "Click here to go back to homepage!"
        # Skin/outfit change prompts
        skin:
            - "Want to see my new outfit?"
            - "The new outfit looks great~"
        # Close prompt
        close: "See you next time~"
        # About link
        link: "https://nav.kungal.org"
