# Admin (CMS) backend configuration
backend:
    name: github
    repo: Spr-Aachen/Twilight # replace with your GitHub repository
    branch: main # replace with your branch name
    site_domain: twilight.spr-aachen.com # replace with your domain
    base_url: https://twilight.spr-aachen.com  # replace with your URL
    auth_endpoint: oauth # OAuth route provided by the integration


# Admin UI language (zh_Hans Simplified Chinese | en English | ...)
locale: en


# Media directory configuration
media_folder: "public/assets/images" # media file storage path
public_folder: "/assets/images" # public access path


# Content management configuration
collections:

    - # Posts
        # Collection name
        name: "posts"
        # Admin display label
        label: "Posts"
        # Content storage directory
        folder: "src/content/posts"
        # Directory nesting configuration
        meta:
            # Path configuration
            path:
                # Admin display label
                label: "Path"
                # Widget that records the path
                widget: hidden # hidden
                # Index file name (used for nested collections)
                index_file: "_index"
        nested:
            # Maximum nesting depth
            depth: 10
            # Summary template, used as the display name for folders in the tree menu
            summary: '{{dirname}}'
            # Whether subfolders are supported
            subfolders: false # since posts are standalone .md files, set to false so the CMS does not look for _index.md inside a folder
        ## List-page grouping configuration
        #view_groups:
        #    - # Group by folder
        #        # Group label
        #        label: "Folder"
        #        # Field to group by
        #        field: "path"
        #        # Group match pattern
        #        pattern: '^([^/]+)/' # match the first path segment (i.e. the folder name)
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{slug}}"
        # Collection-specific media folder configuration
        media_folder: "" # leave empty to use a relative path
        public_folder: "" # leave empty to use a relative path
        # Field list
        fields:
            - # Title
                { name: "title", label: "Title", widget: "string" }
            - # Published date
                { name: "published", label: "Published Date", widget: "datetime" }
            - # Updated date
                { name: "updated", label: "Updated Date", widget: "datetime", required: false }
            - # Description
                { name: "description", label: "Description", widget: "text", required: false }
            - # Cover image
                { name: "cover", label: "Cover", widget: "image", required: false }
            - # Tags
                { name: "tags", label: "Tags", widget: "list", default: [], required: false }
            - # Category
                { name: "category", label: "Category", widget: "string", required: false }
            - # Draft
                { name: "draft", label: "Draft", widget: "boolean", default: false }
            - # Body
                { name: "body", label: "Body", widget: "markdown" }

    - # Diary
        # Collection name
        name: "diary"
        # Admin display label
        label: "Diary"
        # Content storage directory
        folder: "src/content/diary"
        # Entry path configuration
        path: "{{slug}}/{{slug}}" # {folder}/{filename}
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}"
        # File storage format
        format: "json"
        # Collection-specific media folder configuration
        media_folder: "" # leave empty to use a relative path
        public_folder: "" # leave empty to use a relative path
        # Field list
        fields:
            - # Diary title
                { name: "title", label: "Title", widget: "string" }
            - # Diary content
                { name: "content", label: "Content", widget: "text" }
            - # Diary date
                { name: "date", label: "Date", widget: "datetime" }
            - # Image list
                name: "images"
                label: "Images"
                widget: "list"
                required: false
                default: []
                field: { name: "image", label: "Image", widget: "image" }

    - # Albums
        # Collection name
        name: "albums"
        # Admin display label
        label: "Albums"
        # Content storage directory
        folder: "src/content/albums"
        # Entry path configuration
        path: "{{slug}}/{{slug}}" # {folder}/{filename}
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{slug}}"
        # File storage format
        format: "json"
        # Collection-specific media folder configuration
        media_folder: "" # leave empty to use a relative path
        public_folder: "" # leave empty to use a relative path
        # Field list
        fields:
            - # Album title
                { name: "title", label: "Title", widget: "string" }
            - # Album description
                { name: "description", label: "Description", widget: "text", required: false }
            - # Album cover
                { name: "cover", label: "Cover", widget: "image" }
            - # Date
                { name: "date", label: "Date", widget: "datetime" }
            - # Location
                { name: "location", label: "Location", widget: "string", required: false }
            - # Tags
                { name: "tags", label: "Tags", widget: "list", required: false, default: [] }
            - # Layout
                { name: "layout", label: "Layout", widget: "select", options: ["grid", "masonry", "list"], default: "grid" }
            - # Number of columns
                { name: "columns", label: "Columns", widget: "number", default: 3, value_type: "int", min: 1, max: 6 }
            - # Photo list
                name: "photos"
                label: "Photos"
                widget: "list"
                required: false
                fields:
                    - # Image path
                        { name: "src", label: "Image", widget: "image" }
                    - # Image caption
                        { name: "alt", label: "Caption", widget: "string", required: false }
                    - # Image title
                        { name: "title", label: "Title", widget: "string", required: false }
                    - # Image description
                        { name: "description", label: "Description", widget: "text", required: false }
                    - # Tags
                        { name: "tags", label: "Tags", widget: "list", required: false, default: [] }
                    - # Date taken
                        { name: "date", label: "Date", widget: "datetime", required: false }
            - # Whether visible
                { name: "visible", label: "Visible", widget: "boolean", default: true, required: false }

    - # Projects
        # Collection name
        name: "projects"
        # Admin display label
        label: "Projects"
        # Content storage directory
        folder: "src/content/projects"
        # Entry path configuration
        path: "{{slug}}/{{slug}}" # {folder}/{filename}
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{slug}}"
        # File storage format
        format: "json"
        # Collection-specific media folder configuration
        media_folder: "" # leave empty to use a relative path
        public_folder: "" # leave empty to use a relative path
        # Field list
        fields:
            - # Project title
                { name: "title", label: "Title", widget: "string" }
            - # Project description
                { name: "description", label: "Description", widget: "text" }
            - # Project cover
                { name: "image", label: "Image", widget: "image", required: false }
            - # Project category
                { name: "category", label: "Category", widget: "select", options: ["library","ai","software","website","game"] }
            - # Tech stack
                { name: "techStack", label: "Tech Stack", widget: "list", default: [] }
            - # Project status
                { name: "status", label: "Status", widget: "select", options: ["completed","in-progress","planned"] }
            - # Live demo
                { name: "liveDemo", label: "Live Demo", widget: "string", required: false }
            - # Source code
                { name: "sourceCode", label: "Source Code", widget: "string", required: false }
            - # Start date
                { name: "startDate", label: "Start Date", widget: "datetime" }
            - # End date
                { name: "endDate", label: "End Date", widget: "datetime", required: false }
            - # Whether featured
                { name: "featured", label: "Featured", widget: "boolean", required: false, default: false }
            - # Tags
                { name: "tags", label: "Tags", widget: "list", required: false, default: [] }

    - # Skills
        # Collection name
        name: "skills"
        # Admin display label
        label: "Skills"
        # Content storage directory
        folder: "src/content/skills"
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{slug}}"
        # File storage format
        format: "json"
        # Field list
        fields:
            - # Skill name
                { name: "name", label: "Name", widget: "string" }
            - # Skill description
                { name: "description", label: "Description", widget: "text" }
            - # Icon
                { name: "icon", label: "Icon", widget: "string" }
            - # Skill category
                { name: "category", label: "Category", widget: "select", options: ["ai","backend","client","frontend","database","engines","tools","others"] }
            - # Proficiency level
                { name: "level", label: "Level", widget: "select", options: ["beginner","intermediate","advanced","expert"] }
            - # Experience
                name: "experience"
                label: "Experience"
                widget: "object"
                fields:
                    - # Years
                        { name: "years", label: "Years", widget: "number", value_type: "int", min: 0 }
                    - # Months
                        { name: "months", label: "Months", widget: "number", value_type: "int", min: 0, max: 11 }
            - # Related projects
               { name: "projects", label: "Projects", widget: "list", required: false, default: [] }
            - # Related certifications
               { name: "certifications", label: "Certifications", widget: "list", required: false, default: [] }
            - # Theme color
               { name: "color", label: "Color", widget: "string", required: false }

    - # Timeline
        # Collection name
        name: "timeline"
        # Admin display label
        label: "Timeline"
        # Content storage directory
        folder: "src/content/timeline"
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{slug}}"
        # File storage format
        format: "json"
        # Field list
        fields:
            - # Title
                { name: "title", label: "Title", widget: "string" }
            - # Description
                { name: "description", label: "Description", widget: "text" }
            - # Type
                { name: "type", label: "Type", widget: "select", options: ["education","work","project","achievement"] }
            - # Start date
                { name: "startDate", label: "Start Date", widget: "datetime" }
            - # End date
                { name: "endDate", label: "End Date", widget: "datetime", required: false }
            - # Location
                { name: "location", label: "Location", widget: "string", required: false }
            - # Organization / institution
                { name: "organization", label: "Organization", widget: "string", required: false }
            - # Position
                { name: "position", label: "Position", widget: "string", required: false }
            - # Related skills
                { name: "skills", label: "Skills", widget: "list", required: false, default: [] }
            - # Related achievements
                { name: "achievements", label: "Achievements", widget: "list", required: false, default: [] }
            - # Related links
                name: "links"
                label: "Links"
                widget: "list"
                required: false
                fields:
                    - # Link name
                        { name: "name", label: "Name", widget: "string" }
                    - # Link URL
                        { name: "url", label: "URL", widget: "string" }
                    - # Link type
                        { name: "type", label: "Type", widget: "select", options: ["certificate","project","other"] }
            - # Icon
                { name: "icon", label: "Icon", widget: "string", required: false }
            - # Theme color
                { name: "color", label: "Color", widget: "string", required: false }

    - # Friend links
        # Collection name
        name: "friends"
        # Admin display label
        label: "Friends"
        # Content storage directory
        folder: "src/content/friends"
        # Allow creating new entries
        create: true
        # File naming rule
        slug: "{{slug}}"
        # File storage format
        format: "json"
        # Field list
        fields:
            - # Site name
                { name: "title", label: "Title", widget: "string" }
            - # Avatar URL
                { name: "imgurl", label: "Avatar URL", widget: "string" }
            - # Site description
                { name: "desc", label: "Description", widget: "text" }
            - # Site URL
                { name: "siteurl", label: "Site URL", widget: "string" }
            - # Tags
                { name: "tags", label: "Tags", widget: "list", required: false, default: [] }

    - # Friend links page
        # Collection name
        name: "page_friends"
        # Admin display label
        label: "Friends Page"
        # File list
        files:
            - # friends.md
                name: "friends"
                label: "Friends"
                file: "src/content/friends.md"
                fields:
                    #- # Name
                    #    { name: "title", label: "Title", widget: "string", required: false }
                    #- # Description
                    #    { name: "description", label: "Description", widget: "string", required: false }
                    - # Body
                        { name: "body", label: "Body", widget: "markdown" }

    - # About
        # Collection name
        name: "page_about"
        # Admin display label
        label: "About Page"
        # File list
        files:
            - # about.md
                name: "about"
                label: "About"
                file: "src/content/about.md"
                fields:
                    #- # Name
                    #    { name: "title", label: "Title", widget: "string", required: false }
                    #- # Description
                    #    { name: "description", label: "Description", widget: "string", required: false }
                    - # Body
                        { name: "body", label: "Body", widget: "markdown" }


# Editor configuration
editor:
    # Enable the preview feature
    preview: true
