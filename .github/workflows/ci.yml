name: CI

# Build every pull request, and automatically merge + deploy Dependabot PRs
# once the build passes. Replaces the old "close conflicted PRs" workflow:
# conflicts (if they ever happen) are now rebased by Dependabot, not discarded.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.14.4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    needs: build
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Safety belt: only auto-merge non-major updates (majors are also ignored
      # in dependabot.yml, so this should never see one).
      - name: Squash-merge the PR
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge performed with GITHUB_TOKEN does not trigger the push-based
      # deploy workflow, so dispatch it explicitly (workflow_dispatch is the
      # documented exception that GITHUB_TOKEN is allowed to trigger).
      - name: Trigger deployment
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
