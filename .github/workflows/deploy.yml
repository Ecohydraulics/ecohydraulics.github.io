name: Deploy to GitHub Pages

on:
  # Trigger this workflow on every push to the `main` branch
  # If you use a different branch name, replace `main` with your branch name as needed
  push:
    branches: [ main ]
  # Allows you to trigger this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Allow the job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@9.14.4
          build-cmd: pnpm run build
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotes for variable values. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Notify IndexNow (Bing, Yandex, …) about URLs changed in this push, once the
  # new content is live. Runs only after a successful deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute changed files
        id: changes
        run: |
          if git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            DIFF=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            DIFF=$(git diff --name-only HEAD~1 HEAD || true)
          fi
          {
            echo "changed<<EOF"
            echo "$DIFF"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Submit changed URLs to IndexNow
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed }}
        run: node scripts/indexnow-submit.mjs